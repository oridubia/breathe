name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

# Least-privilege token; jobs only read the repo.
permissions:
  contents: read

# Newer pushes cancel superseded runs on the same ref.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: BreatheCore tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Build and test, warnings as errors
        run: swift test --package-path ios/BreatheCore -Xswiftc -warnings-as-errors

  app:
    name: App build (Xcode)
    # macOS minutes are the expensive ones: only spend them on a core that passes.
    needs: core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: BreatheCore tests on Apple's toolchain
        run: swift test --package-path ios/BreatheCore -Xswiftc -warnings-as-errors
      # The app target treats Swift warnings as errors in its own build
      # settings. Passing that here instead would also reach the BreatheCore
      # package target, which Xcode builds with -suppress-warnings, and the two
      # flags conflict; the core is held to the same bar by `swift test` above.
      - name: Build for the simulator
        run: >-
          xcodebuild build -quiet
          -project ios/Breathe.xcodeproj -scheme Breathe -configuration Debug
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/simulator
          CODE_SIGNING_ALLOWED=NO
      - name: Build for devices, unsigned
        run: >-
          xcodebuild build -quiet
          -project ios/Breathe.xcodeproj -scheme Breathe -configuration Release
          -destination "generic/platform=iOS"
          -derivedDataPath build/device
          CODE_SIGNING_ALLOWED=NO
      - name: Package the unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Breathe.app build/ipa/Payload/
          cd build/ipa && zip -qry ../Breathe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Breathe-unsigned-ipa
          path: build/Breathe-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
